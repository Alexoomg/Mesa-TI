{% extends "base.html" %}{% block body %}
<div class="card empty reveal" style="margin-top:48px">
  <div class="big">{{ '🔍' if code==404 else '⚠️' }}</div>
  <h1 style="font-size:3rem;margin:0;color:var(--primary)">{{ code }}</h1>
  <p style="font-size:1.1rem;margin:6px 0 20px">{{ msg }}</p>
  <a class="btn" href="{{ url_for('index') }}">Volver al listado</a>
</div>
{% endblock %}
