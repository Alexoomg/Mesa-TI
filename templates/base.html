<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de Soporte TI</title>
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:0 auto;padding:1rem;color:#222}
nav{display:flex;justify-content:space-between;border-bottom:2px solid #1f4e79;padding-bottom:.5rem;margin-bottom:1rem}
nav a{color:#1f4e79;text-decoration:none;font-weight:600;margin-right:1rem}
table{width:100%;border-collapse:collapse}th,td{padding:.4rem;border-bottom:1px solid #ddd;text-align:left}
.cards{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.card{background:#eef3f8;padding:.6rem 1rem;border-radius:6px;min-width:100px}.card b{font-size:1.4rem;display:block}
.flash{background:#e6f4ea;padding:.5rem;border-radius:4px;margin-bottom:1rem}
.err{background:#fdecea;padding:.5rem;border-radius:4px;margin-bottom:1rem}
label{display:block;margin-top:.6rem;font-weight:600}input,select,textarea{width:100%;padding:.4rem;box-sizing:border-box}
button{margin-top:.8rem;padding:.5rem 1rem;background:#1f4e79;color:#fff;border:0;border-radius:4px;cursor:pointer}
.filtros{display:flex;gap:.5rem;align-items:end;margin-bottom:1rem}.filtros select{width:auto}.filtros button{margin:0}
</style></head><body>
<nav><div><a href="{{ url_for('index') }}">Solicitudes</a><a href="{{ url_for('nuevo') }}">Nueva solicitud</a></div><span>Mesa de Soporte TI</span></nav>
{% with m = get_flashed_messages() %}{% for x in m %}<div class="flash">{{ x }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}</body></html>
