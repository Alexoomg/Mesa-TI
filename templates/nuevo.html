{% extends "base.html" %}{% block body %}
<div class="page-head"><div><h1>Nueva solicitud</h1><p class="sub">Describe el problema para que el equipo pueda atenderlo.</p></div></div>
<form class="card form-card reveal" method="post" novalidate>
  {% for e in errores %}<div class="alert">⚠ {{ e }}</div>{% endfor %}
  <div class="form-row"><label>Solicitante</label><input name="solicitante" placeholder="Nombre de quien solicita" value="{{ f.get('solicitante','') }}"></div>
  <div class="form-row"><label>Título</label><input name="titulo" placeholder="Ej.: No enciende el computador" value="{{ f.get('titulo','') }}"></div>
  <div class="form-row"><label>Descripción</label><textarea name="descripcion" placeholder="Cuéntanos qué ocurre, desde cuándo y qué ya intentaste">{{ f.get('descripcion','') }}</textarea></div>
  <div class="grid2 form-row">
    <div><label>Categoría</label><select name="categoria">{% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if c.id|string==f.get('categoria') }}>{{ c.nombre }}</option>{% endfor %}</select></div>
    <div><label>Prioridad</label><select name="prioridad">{% for p in prioridades %}<option {{ 'selected' if p==f.get('prioridad') }}>{{ p }}</option>{% endfor %}</select></div>
  </div>
  <div class="actions"><a class="btn ghost" href="{{ url_for('index') }}">Cancelar</a><button class="btn">Registrar solicitud</button></div>
</form>
{% endblock %}
